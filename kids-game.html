<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alphabet Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }

  /* Stars canvas behind everything */
  #star-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* Tail canvas */
  #tail-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  /* TOP GRID */
  #grid {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(7, 1fr); /* 7 rows for 26 letters (last row has 2) */
    padding: 6px;
    gap: 4px;
  }

  .grid-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    position: relative;
    overflow: hidden;
  }

  .grid-letter {
    font-family: 'Courier New', monospace;
    font-weight: 900;
    line-height: 1;
    opacity: 0;
    transform: scale(0) rotate(-20deg);
    transition: none;
    text-align: center;
  }

  .grid-letter.visible {
    animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .grid-letter.dancing {
    animation: dance 0.5s ease-in-out infinite alternate !important;
  }

  @keyframes popIn {
    0%   { opacity:0; transform: scale(0) rotate(-20deg); }
    60%  { opacity:1; transform: scale(1.35) rotate(6deg); }
    100% { opacity:1; transform: scale(1) rotate(0deg); }
  }

  @keyframes dance {
    0%   { transform: translateY(-5px) rotate(-10deg) scale(1.1); }
    25%  { transform: translateY(5px)  rotate(10deg)  scale(0.95); }
    50%  { transform: translateY(-7px) rotate(-6deg)  scale(1.15); }
    75%  { transform: translateY(4px)  rotate(7deg)   scale(0.97); }
    100% { transform: translateY(-5px) rotate(-10deg) scale(1.1); }
  }

  /* FALLING LETTER */
  #falling-wrap {
    position: fixed;
    left: 50%;
    top: -200px;
    transform: translateX(-50%);
    z-index: 50;
    pointer-events: none;
    display: none;
  }

  #falling-letter {
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: clamp(80px, 22vw, 160px);
    line-height: 1;
    display: block;
    text-align: center;
    filter: drop-shadow(0 0 20px currentColor) drop-shadow(0 0 40px currentColor);
  }

  /* HINT */
  #hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: clamp(13px, 4vw, 18px);
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
    animation: blink 1.5s ease-in-out infinite;
    z-index: 10;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }

  /* IMPACT FLASH */
  #impact-flash {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 80px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 60;
    opacity: 0;
  }

  /* RIPPLE */
  .ripple {
    position: fixed;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    transform: scale(0);
    animation: rippleAnim 0.55s linear forwards;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes rippleAnim {
    to { transform: scale(5); opacity: 0; }
  }

  /* SPARK */
  .spark {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 61;
  }

  /* CELEBRATION */
  #celebration {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #celebration.active { display: flex; pointer-events: all; }

  #celebration h1 {
    font-size: clamp(28px, 7vw, 70px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px #fff, 0 0 60px gold;
    animation: pulseText 0.9s ease-in-out infinite alternate;
    letter-spacing: 3px;
    text-align: center;
    padding: 0 16px;
  }

  @keyframes pulseText {
    0%   { transform: scale(1);    text-shadow: 0 0 30px #fff, 0 0 60px gold; }
    100% { transform: scale(1.07); text-shadow: 0 0 50px #fff, 0 0 100px gold, 0 0 20px cyan; }
  }

  .confetti {
    position: fixed;
    z-index: 202;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>
<canvas id="tail-canvas"></canvas>

<div id="grid"></div>

<div id="falling-wrap">
  <span id="falling-letter">A</span>
</div>

<div id="impact-flash"></div>

<div id="celebration">
  <h1>🎉 A to Z Complete! 🎉</h1>
</div>

<div id="hint">TAP ONCE TO BEGIN ✨</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const COLS = 4;

const NEON_COLORS = [
  '#ff2d55','#ff6b35','#ffe600','#39ff14',  // A B C D
  '#00eaff','#bf5fff','#ff0090','#ff4500',  // E F G H
  '#00ff99','#ffaa00','#00bfff','#ff1493',  // I J K L
  '#adff2f','#ff6ec7','#7fff00','#ff007f',  // M N O P
  '#00ffff','#ff3333','#ccff00','#9400ff',  // Q R S T
  '#ff8800','#00ff41','#ff00cc','#44eeff',  // U V W X
  '#ffdd00','#ff69b4'                        // Y Z
];

let currentIndex = 0;
let isAnimating = false;
let gridLetterEls = [];

// ─── COMPUTE GRID SIZE ────────────────────────────────────────────
// We have 26 letters, 4 per row → 7 rows (last row has 2)
const ROWS = Math.ceil(ALPHABET.length / COLS); // 7

// ─── BUILD GRID ───────────────────────────────────────────────────
const grid = document.getElementById('grid');

// Last row layout: 4 cols, 26 letters → row 7 has only Y,Z
// We place: [empty, Y, Z, empty] for centering
// Grid DOM positions: 0..23 = A..X (rows 1-6), then 4 cells for row 7
// gridDomIndex[i] = which DOM child index maps to letter i
// Row 7: col0=empty, col1=Y(24), col2=Z(25), col3=empty
// So total DOM cells = 24 + 4 = 28
// letter index → dom child index mapping:
// A-X (0-23) → dom 0-23
// Y (24) → dom 25 (col1 of last row, after 1 empty at dom 24)
// Z (25) → dom 26
// dom 24 = empty, dom 27 = empty

let letterToDom = []; // letterToDom[letterIndex] = domChildIndex

function buildGrid() {
  const vw = window.innerWidth;

  const padding = 6;
  const gap = 4;
  const cellW = Math.floor((vw - padding * 2 - gap * (COLS - 1)) / COLS);
  const cellH = cellW;

  grid.style.gridTemplateColumns = `repeat(${COLS}, ${cellW}px)`;
  grid.style.gridTemplateRows = `repeat(${ROWS}, ${cellH}px)`;
  grid.style.padding = padding + 'px';
  grid.style.gap = gap + 'px';
  grid.style.width = (COLS * cellW + (COLS - 1) * gap + padding * 2) + 'px';
  grid.style.margin = '0 auto';
  grid.style.left = '0';
  grid.style.right = '0';

  const fontSize = Math.floor(cellW * 0.62);

  gridLetterEls = [];
  letterToDom = [];
  grid.innerHTML = '';

  // Total DOM cells = 7 rows × 4 cols = 28
  // Letters A-X → dom slots 0-23
  // Row 7: slot24=empty, slot25=Y, slot26=Z, slot27=empty
  const TOTAL_CELLS = ROWS * COLS; // 28

  for (let dom = 0; dom < TOTAL_CELLS; dom++) {
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    cell.style.width = cellW + 'px';
    cell.style.height = cellH + 'px';

    // Determine which letter belongs here
    let letterIdx = -1;
    if (dom < 24) {
      // A through X
      letterIdx = dom;
    } else if (dom === 25) {
      letterIdx = 24; // Y
    } else if (dom === 26) {
      letterIdx = 25; // Z
    }
    // dom 24 and 27 are empty spacers

    if (letterIdx >= 0) {
      const span = document.createElement('span');
      span.className = 'grid-letter';
      span.style.fontSize = fontSize + 'px';
      span.style.color = NEON_COLORS[letterIdx];
      span.style.textShadow = `0 0 10px ${NEON_COLORS[letterIdx]}, 0 0 22px ${NEON_COLORS[letterIdx]}`;
      span.textContent = ALPHABET[letterIdx];
      cell.appendChild(span);
      gridLetterEls[letterIdx] = span;
      letterToDom[letterIdx] = dom;
    } else {
      // Empty spacer cell — invisible border
      cell.style.background = 'transparent';
      cell.style.border = 'none';
    }

    grid.appendChild(cell);
  }

  return { cellW, cellH, fontSize };
}

let gridMetrics = buildGrid();

window.addEventListener('resize', () => {
  gridMetrics = buildGrid();
  // Re-show already collected letters
  for (let i = 0; i < currentIndex; i++) {
    if (gridLetterEls[i]) {
      gridLetterEls[i].style.opacity = '1';
      gridLetterEls[i].style.transform = 'scale(1) rotate(0deg)';
    }
  }
});

// ─── AUDIO ────────────────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// C major pentatonic scale across 3 octaves — always sounds musical & happy
const PENTATONIC = [
  261.63, 293.66, 329.63, 392.00, 440.00,   // C4 D4 E4 G4 A4
  523.25, 587.33, 659.25, 783.99, 880.00,   // C5 D5 E5 G5 A5
  1046.50,1174.66,1318.51,1567.98,1760.00   // C6 D6 E6 G6 A6
];

// Pick a random note from pentatonic scale
function randomNote() {
  return PENTATONIC[Math.floor(Math.random() * PENTATONIC.length)];
}

// Rich piano-like tone: sine + triangle + soft harmonic overtone
function playPianoTone(freq, vol = 0.5, delay = 0) {
  try {
    const ctx = getAudio();
    const t = ctx.currentTime + delay;

    // Main fundamental (sine — warm body)
    const osc1 = ctx.createOscillator();
    const g1   = ctx.createGain();
    osc1.type  = 'sine';
    osc1.frequency.setValueAtTime(freq, t);
    g1.gain.setValueAtTime(vol, t);
    g1.gain.exponentialRampToValueAtTime(0.001, t + 1.4);

    // 2nd harmonic (triangle — bright attack)
    const osc2 = ctx.createOscillator();
    const g2   = ctx.createGain();
    osc2.type  = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, t);
    g2.gain.setValueAtTime(vol * 0.45, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

    // 3rd harmonic (sine — shimmer)
    const osc3 = ctx.createOscillator();
    const g3   = ctx.createGain();
    osc3.type  = 'sine';
    osc3.frequency.setValueAtTime(freq * 3, t);
    g3.gain.setValueAtTime(vol * 0.18, t);
    g3.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

    // Soft reverb-like delay tap
    const osc4 = ctx.createOscillator();
    const g4   = ctx.createGain();
    osc4.type  = 'sine';
    osc4.frequency.setValueAtTime(freq, t + 0.07);
    g4.gain.setValueAtTime(vol * 0.22, t + 0.07);
    g4.gain.exponentialRampToValueAtTime(0.001, t + 1.8);

    const master = ctx.createGain();
    master.gain.setValueAtTime(0.72, t);

    osc1.connect(g1); g1.connect(master);
    osc2.connect(g2); g2.connect(master);
    osc3.connect(g3); g3.connect(master);
    osc4.connect(g4); g4.connect(master);
    master.connect(ctx.destination);

    const end = t + 1.9;
    osc1.start(t); osc1.stop(end);
    osc2.start(t); osc2.stop(t + 0.6);
    osc3.start(t); osc3.stop(t + 0.35);
    osc4.start(t + 0.07); osc4.stop(end);
  } catch(e) {}
}

// Drop sound: random note + optional soft chord colour note
function playNote(index, vol = 0.5, delay = 0) {
  const freq = randomNote();
  playPianoTone(freq, vol, delay);
  // 40% chance: add a soft harmony note (a 5th or 3rd above)
  if (Math.random() < 0.4) {
    const interval = Math.random() < 0.5 ? 1.5 : 1.25; // perfect 5th or major 3rd
    playPianoTone(freq * interval, vol * 0.28, delay + 0.04);
  }
}

// Celebration: ascending random pentatonic arpeggio, then a chord burst
function playCelebration() {
  // Ascending arpeggio with random picks
  const picked = [...PENTATONIC].sort(() => Math.random() - 0.5).slice(0, 10);
  picked.sort((a, b) => a - b); // sort low→high for ascending feel
  picked.forEach((freq, i) => {
    setTimeout(() => playPianoTone(freq, 0.4, 0), i * 110);
  });
  // After arpeggio: full chord burst
  setTimeout(() => {
    [261.63, 329.63, 392.00, 523.25, 659.25].forEach((freq, i) => {
      playPianoTone(freq, 0.35, i * 0.03);
    });
  }, 1200);
  // Second wave
  setTimeout(() => {
    const wave = [...PENTATONIC].sort(() => Math.random() - 0.5).slice(0, 8);
    wave.forEach((freq, i) => {
      playPianoTone(freq, 0.3, i * 0.08);
    });
  }, 2000);
}

// ─── STARS ────────────────────────────────────────────────────────
const starCanvas = document.getElementById('star-canvas');
const starCtx = starCanvas.getContext('2d');
starCanvas.width = window.innerWidth;
starCanvas.height = window.innerHeight;

const stars = Array.from({length: 100}, () => ({
  x: Math.random() * starCanvas.width,
  y: Math.random() * starCanvas.height,
  r: Math.random() * 1.4 + 0.2,
  speed: 0.003 + Math.random() * 0.007
}));

function drawStars(ts) {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  for (const s of stars) {
    const a = 0.25 + 0.7 * Math.abs(Math.sin(ts * s.speed));
    starCtx.globalAlpha = a;
    starCtx.fillStyle = '#ffffff';
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fill();
  }
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

// ─── TAIL CANVAS ──────────────────────────────────────────────────
const tailCanvas = document.getElementById('tail-canvas');
const tailCtx = tailCanvas.getContext('2d');
tailCanvas.width = window.innerWidth;
tailCanvas.height = window.innerHeight;

let tailParticles = [];

function addTail(x, y, color) {
  for (let i = 0; i < 3; i++) {
    tailParticles.push({
      x: x + (Math.random() - 0.5) * 24,
      y: y + (Math.random() - 0.5) * 10,
      size: Math.random() * 20 + 10,
      alpha: 0.85,
      color,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -Math.random() * 1.5,
      decay: 0.045 + Math.random() * 0.03
    });
  }
}

function drawTail() {
  tailCtx.clearRect(0, 0, tailCanvas.width, tailCanvas.height);
  tailParticles = tailParticles.filter(p => p.alpha > 0.01);
  for (const p of tailParticles) {
    tailCtx.save();
    tailCtx.globalAlpha = p.alpha;
    tailCtx.shadowBlur = 18;
    tailCtx.shadowColor = p.color;
    tailCtx.fillStyle = p.color;
    tailCtx.beginPath();
    tailCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
    tailCtx.fill();
    tailCtx.restore();
    p.alpha -= p.decay;
    p.size *= 0.94;
    p.x += p.vx;
    p.y += p.vy;
  }
  requestAnimationFrame(drawTail);
}
drawTail();

// ─── IMPACT ───────────────────────────────────────────────────────
function createImpact(x, color) {
  const flash = document.getElementById('impact-flash');
  flash.style.left = x + 'px';
  flash.style.background = `radial-gradient(ellipse, ${color}bb 0%, transparent 70%)`;
  flash.animate([
    { opacity: 1, transform: 'translateX(-50%) scaleX(1.8) scaleY(1)' },
    { opacity: 0, transform: 'translateX(-50%) scaleX(0.6) scaleY(0.4)' }
  ], { duration: 380, easing: 'ease-out', fill: 'forwards' });

  // Sparks
  for (let i = 0; i < 20; i++) {
    const spark = document.createElement('div');
    spark.className = 'spark';
    const angle = (Math.PI * i / 10) - Math.PI;
    const speed = 50 + Math.random() * 90;
    const tx = Math.cos(angle) * speed;
    const ty = Math.sin(angle) * speed - 70;
    const size = 5 + Math.random() * 7;
    spark.style.cssText = `
      width:${size}px;height:${size}px;
      background:${color};
      box-shadow:0 0 8px ${color},0 0 16px ${color};
      left:${x}px;bottom:${50 + Math.random()*20}px;
    `;
    spark.animate([
      { transform: 'translate(-50%,0) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px),${ty}px) scale(0)`, opacity: 0 }
    ], { duration: 450 + Math.random() * 300, easing: 'ease-out', fill: 'forwards' });
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 800);
  }
}

// ─── RIPPLE ───────────────────────────────────────────────────────
function createRipple(cx, cy) {
  const r = document.createElement('div');
  r.className = 'ripple';
  const s = 80;
  r.style.cssText = `width:${s}px;height:${s}px;left:${cx - s/2}px;top:${cy - s/2}px;`;
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 650);
}

// ─── GET CELL CENTER (target for letter to fly to) ────────────────
function getCellCenter(index) {
  const domIdx = letterToDom[index];
  const cell = grid.children[domIdx];
  if (!cell) return { x: window.innerWidth / 2, y: 40 };
  const rect = cell.getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

// ─── MAIN DROP ANIMATION ──────────────────────────────────────────
const fallingWrap = document.getElementById('falling-wrap');
const fallingEl = document.getElementById('falling-letter');

function dropLetter(index) {
  if (isAnimating || index >= ALPHABET.length) return;
  isAnimating = true;

  const letter = ALPHABET[index];
  const color = NEON_COLORS[index];
  const centerX = window.innerWidth / 2;

  // Setup falling letter
  fallingEl.textContent = letter;
  fallingEl.style.color = color;
  fallingEl.style.textShadow = `0 0 20px ${color}, 0 0 50px ${color}, 0 0 90px ${color}`;
  fallingWrap.style.display = 'block';
  fallingWrap.style.left = centerX + 'px';
  fallingWrap.style.transform = 'translateX(-50%)';

  // Play note on drop
  playNote(index, 0.6);

  const startY = -180;
  const endY = window.innerHeight - 130;
  const dropDuration = 820;
  let startTime = null;

  function animateDrop(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const progress = Math.min(elapsed / dropDuration, 1);
    // Gravity ease-in
    const eased = 1 - Math.pow(1 - progress, 2.8);
    const currentY = startY + (endY - startY) * eased;

    fallingWrap.style.top = currentY + 'px';

    // Tail particles
    if (progress > 0.05 && progress < 0.98) {
      addTail(centerX, currentY + 50, color);
    }

    if (progress < 1) {
      requestAnimationFrame(animateDrop);
    } else {
      // Hit bottom
      createImpact(centerX, color);
      playNote(index, 0.35);

      // Squish bounce
      fallingEl.animate([
        { transform: 'scaleX(1.5) scaleY(0.55)' },
        { transform: 'scaleX(0.85) scaleY(1.2)' },
        { transform: 'scaleX(1) scaleY(1)' }
      ], { duration: 280, easing: 'ease-out' });

      // After squish, fly to grid cell
      setTimeout(() => flyToGrid(index, color, centerX, endY + 50), 280);
    }
  }

  requestAnimationFrame(animateDrop);
}

function flyToGrid(index, color, fromX, fromY) {
  const target = getCellCenter(index);
  const flyDuration = 500;
  let startTime = null;

  const startTop = fromY - 50;

  function animateFly(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const progress = Math.min(elapsed / flyDuration, 1);
    // Ease out
    const eased = 1 - Math.pow(1 - progress, 3);

    const cx = fromX + (target.x - fromX) * eased;
    const cy = startTop + (target.y - startTop) * eased;
    const scale = 1 - (1 - 0.15) * eased; // shrink from big to small

    fallingWrap.style.left = cx + 'px';
    fallingWrap.style.top = cy + 'px';
    fallingEl.style.transform = `translateX(-50%) scale(${scale})`;

    // Tail while flying
    if (progress < 0.95) {
      addTail(cx, cy, color);
    }

    if (progress < 1) {
      requestAnimationFrame(animateFly);
    } else {
      // Snap into grid
      fallingWrap.style.display = 'none';
      fallingEl.style.transform = '';

      const gridSpan = gridLetterEls[index];
      gridSpan.classList.add('visible');

      // Play soft note when landing in grid
      playNote(index, 0.28);

      isAnimating = false;
      currentIndex++;
      document.getElementById('hint').style.display = 'none';

      if (currentIndex >= ALPHABET.length) {
        setTimeout(triggerCelebration, 400);
      } else {
        // Auto-drop next letter after a short pause
        setTimeout(() => {
          dropLetter(currentIndex);
        }, 420);
      }
    }
  }

  requestAnimationFrame(animateFly);
}

// ─── CELEBRATION ──────────────────────────────────────────────────
function triggerCelebration() {
  playCelebration();

  // Dance all letters
  gridLetterEls.forEach((el, i) => {
    setTimeout(() => {
      el.classList.remove('visible');
      el.classList.add('dancing');
      el.style.opacity = '1';
      el.style.animationDelay = (Math.random() * 0.35) + 's';
      el.style.animationDuration = (0.38 + Math.random() * 0.35) + 's';
    }, i * 35);
  });

  const cel = document.getElementById('celebration');
  cel.classList.add('active');

  // Confetti burst
  const confColors = ['#ff2d55','#ffe600','#39ff14','#00eaff','#bf5fff','#ff6b35','#ff69b4','#adff2f','#00ffff','#ffaa00'];

  function spawnConfetti(count, delayBase) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        const sz = 6 + Math.random() * 10;
        c.style.cssText = `
          left:${Math.random() * 100}vw;
          top:-20px;
          width:${sz}px;
          height:${sz}px;
          background:${confColors[Math.floor(Math.random() * confColors.length)]};
          border-radius:${Math.random() > 0.5 ? '50%' : '3px'};
          animation-duration:${2.2 + Math.random() * 2.5}s;
        `;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }, delayBase + i * 55);
    }
  }

  spawnConfetti(100, 0);
  spawnConfetti(70, 2200);
  spawnConfetti(60, 4500);

  // Tap to dismiss
  setTimeout(() => {
    cel.addEventListener('click', () => cel.classList.remove('active'), { once: true });
  }, 2000);
}

// ─── INPUT HANDLING ───────────────────────────────────────────────
// Only the VERY FIRST tap starts the chain. After that, auto-chain takes over.
let started = false;

function handleTap(cx, cy) {
  if (started) return; // auto-chain is running, ignore extra taps
  if (currentIndex < ALPHABET.length) {
    started = true;
    createRipple(cx, cy);
    dropLetter(currentIndex);
  }
}

document.addEventListener('click', (e) => {
  handleTap(e.clientX, e.clientY);
});

document.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    handleTap(window.innerWidth / 2, window.innerHeight / 2);
  }
});
</script>
